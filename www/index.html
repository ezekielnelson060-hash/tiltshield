<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiltshield</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #e4e4e7; font-family: system-ui, sans-serif; }
      .wrap { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 12px; }
      a { color: #34d399; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>Tiltshield</p>
      <p style="opacity:.6;font-size:14px">Loading production shell…</p>
      <p style="font-size:12px"><a href="https://tiltshield.vercel.app">Open web app</a></p>
    </div>
    <script>
      if (!window.Capacitor) {
        location.replace("https://tiltshield.vercel.app");
      }
    </script>
  </body>
</html>
